<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>
</head>

<body>
    
    <p>Rock Paper Scissors</p>
    <button onclick="
    playGame('rock');
    ">Rock</button>
    <button onclick="
    playGame('paper');
    ">Paper</button>
    <button onclick="
    playGame('scissors');
    ">Scissors</button>
   
    <!-- When we click a button: 1.computer randomly selects a move 
    2. compares user input to what the computer selected
    3. displays the result in a pop up
    -->
    
    <script>
    let playerMove;
    let computerMove;
    // function for game logic
    function playGame(playerMove){
    pickComputerMove();
    let result = '';
    if(playerMove === 'scissors'){
        if(computerMove === 'scissors'){
            result = 'tie';
        }
        else if(computerMove === 'paper'){
            result = 'you win';
        }
        else if(computerMove === 'rock'){
            result = 'you lose';
        }
    }
    else if(playerMove === 'rock'){
        if(computerMove === 'rock'){
            result = 'tie';
        }
        else if(computerMove === 'paper'){
            result = 'you lose';
        }
        else if(computerMove === 'scissors'){
            result = 'you win';
        }
    else if(playerMove === 'paper'){
        if(computerMove === 'paper'){
            result = 'tie';
        }
        else if(computerMove === 'scissors'){
            result = 'you lose';
        }
        else if(computerMove === 'rock'){
            result = 'you win';
        }
    }
    }
        alert(`you picked ${playerMove} and the computer picked ${computerMove}. ${result}`);
    }
    // function to pick a random move for the computer
    function pickComputerMove(){
        const randomNumber = Math.random();
    if(randomNumber >= 0 && randomNumber < 1/3){
        computerMove = 'rock';
    }
    else if(randomNumber >= 0 && randomNumber>1/3 && randomNumber<2/3){
        computerMove = 'paper';
    }
    else if(randomNumber >= 0 && randomNumber > 2/3){
        computerMove = 'scissors';
    }
    console.log(computerMove);

    }
    </script>
</body>

</html>
