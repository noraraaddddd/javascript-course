<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors With Autoplay</title>
    <link rel="stylesheet" href="styles/12-rock-paper-scissors.css">
</head>

<body>
    
    <p class="title">Rock Paper Scissors</p>
    <button onclick="
    playGame('rock');
    " class="move-btn"><img src="rock-paper-scissor-images/rock-emoji.png" class="move-icon"></button>
    <button onclick="
    playGame('paper');
    " class="move-btn"><img src="rock-paper-scissor-images/paper-emoji.png" class="move-icon"></button>
    <button onclick="
    playGame('scissors');
    " class="move-btn"><img src="rock-paper-scissor-images/scissors-emoji.png" class="move-icon"></button>
    <button onclick="reset();" class="reset-button">reset</button>

    <button class="auto-play-button" onclick="autoPlay();">Autoplay</button>

    <p class="js-score result">score</p>
   
    <!-- When we click a button: 1.computer randomly selects a move 
    2. compares user input to what the computer selected
    3. displays the result in a pop up
    -->
    
    <!-- when result='tie' the tie score increases, when the result='you win' the wins score increases,
    when the result = 'you lose' loss score increases-->


    <script src="scripts/12-rock-paper-scissors.js">
   


    </script>
</body>

</html>
